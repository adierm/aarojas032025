<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font Awesome</title>

    <!-- Font Awesome Cloudflare CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <style>
      i {
        font-size: 3rem;
        color: rgb(246, 197, 255);
        margin: 1rem;
      }
      i:hoover {
        color: lightgreen;
        transform: rotate(45deg);
      }
    </style>
  </head>
  <body>
    <h1>
      <a href="https://fontawesome.com/">Font Awesome</a>
      <p>
        The Easy Way: include a
        <a href=" https://cdnjs.com/libraries/font-awesome">Cloudflare</a> link
        to a CDN. Place the link in your head section.
      </p>

      <p>How to Use: Use an old i tag that's deprecated</p>
      <i class="fa-solid fa-phone"></i>Call Us <br />
      <i class="fa-solid fa-envelope"></i>Email Us <br />
      <i class="fa-solid fa-location-dot"></i>Find Us <br />
      <i class="fa-solid fa-camera"></i>Share Photos <br />
      <i class="fa-brands fa-git-alt"></i>Verion Control <br />
    </h1>
  </body>
</html>
